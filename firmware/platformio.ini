; PlatformIO project for the cold-chain secure delivery box.
;
; Hardware:
;   - ESP32 dev board
;   - DS18B20 waterproof temperature probe on GPIO 4 (4.7k pull-up to 3V3)
;   - Reed switch (door sensor) on GPIO 27 (to GND, INPUT_PULLUP)
;   - Normally-closed button (unlock/seal) on GPIO 26 (to GND, INPUT_PULLUP)
;   - Green LED on GPIO 32, Red LED on GPIO 33 (each via ~330R to GND)
;   - Servo latch signal on GPIO 13 (servo powered from an external 5V rail,
;     grounds tied together)
;
; The box reads the probe, signs each reading with its Ed25519 device key and
; POSTs it to the backend (mirrored to Hedera HCS). The latch only opens when
; the backend returns a signed unlock command, and only if no reading breached
; the temperature range.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Serial log verbosity: 0=silent 1=error 2=warn 3=info 4=debug.
build_flags =
    -DLOG_LEVEL=4
lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    rweather/Crypto@^0.4.0
    bblanchon/ArduinoJson@^7.0.4
    madhephaestus/ESP32Servo@^3.0.5
