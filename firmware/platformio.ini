; PlatformIO project for the cold-chain temperature sensor node.
;
; Hardware:
;   - ESP32 dev board
;   - DS18B20 waterproof temperature probe on GPIO 4 (with a 4.7k pull-up
;     resistor between the data line and 3V3)
;
; The node reads the probe, signs each reading with an Ed25519 device key and
; POSTs a signed envelope to the gateway, which forwards it to Hedera HCS.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    rweather/Crypto@^0.4.0
